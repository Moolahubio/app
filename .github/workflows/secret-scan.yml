name: secret-scan

# Keeps secrets out of git, the web bundle and the iOS app
# (docs/privy-account-layer.md §2 and invariant 5). gitleaks is the control that
# enforces; rules and the narrow test-literal allowlists are in .gitleaks.toml.
#
# gitleaks runs as the pinned release binary, checked against the release's
# published SHA-256, not through gitleaks-action, which needs a license key for
# repositories owned by an organization.
#
#   changes   every push and pull request: a branch push scans every commit on
#             the branch that is not on the default branch, so a run that was
#             cancelled or skipped loses nothing; a pull request scans base..head
#   history   every commit on every branch, tag and pull request ref, merge
#             commits included (push to the default branch, weekly, manual)
#   tree      the dependency-free fallback scanner over the checked-out files,
#             the check that no server secret reaches the web or iOS app, and
#             the API ban list (scripts/check-api-ban-list.mjs)
#   bundle    the same app check over a fresh web build
#             (artifacts/moolahub-app/dist/public), built with canary values in
#             every server secret name
#
# No concurrency group: cancelling a run would drop the commits only it scans.

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from gitleaks_8.30.1_checksums.txt
  # on the v8.30.1 release page.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  changes:
    name: gitleaks (new commits)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the commits this event adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="refs/remotes/origin/${DEFAULT_BRANCH}"
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ] \
               && git rev-parse -q --verify "${base}^{commit}" >/dev/null; then
            # Any other branch or tag: everything not on the default branch,
            # whatever earlier pushes and runs did.
            range="$PUSH_AFTER --not $base"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            # The default branch: the history job also scans it on this push.
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER"
          fi
          echo "scanning: $range"
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="$range" .

  history:
    name: gitleaks (full history)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # Pull request refs are public and can hold commits that are on no
      # branch (a force-pushed PR head, GitHub's merge commits).
      - name: Fetch pull request refs
        run: git fetch --no-tags origin '+refs/pull/*:refs/remotes/pull/*'

      # gitleaks' own default is git log -p -U0 --full-history --all
      # --diff-filter=tuxdb, which shows no diff for a merge commit. A set
      # --log-opts replaces everything after -p -U0 (split on spaces), so the
      # defaults are repeated and each merge is diffed against its first parent.
      - name: Scan every commit on every ref, merges included
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="--full-history --all --diff-filter=tuxdb --diff-merges=first-parent" .

  tree:
    name: Fallback scan and app secret check
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Fallback secret scan of the tracked files
        run: node scripts/secret-scan.mjs
      - name: No server secret in the web or iOS app sources
        run: node scripts/check-no-server-secrets.mjs
      - name: API ban list (no user token checks, signer keys or private-key env)
        run: node scripts/check-api-ban-list.mjs

  bundle:
    name: No server secret in the web bundle
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Every server secret name holds a unique canary value, as the real build
      # host holds the real ones. A canary in dist/public means the Vite config
      # or a plugin compiled a value in (define, loadEnv, a widened prefix).
      # SENTRY_AUTH_TOKEN stays unset: it switches on the source map upload.
      - name: Build the web app with canary secrets
        env:
          PORT: "5173"
          BASE_PATH: /
          NODE_ENV: production
          PRIVY_APP_SECRET: canary-PRIVY_APP_SECRET-${{ github.run_id }}
          PRIVY_APP_SECRET_READONLY: canary-PRIVY_APP_SECRET_READONLY-${{ github.run_id }}
          PRIVY_WEBHOOK_SECRET: canary-PRIVY_WEBHOOK_SECRET-${{ github.run_id }}
          DATABASE_URL: canary-DATABASE_URL-${{ github.run_id }}
          MIGRATIONS_DATABASE_URL: canary-MIGRATIONS_DATABASE_URL-${{ github.run_id }}
          APP_ENCRYPTION_KEY: canary-APP_ENCRYPTION_KEY-${{ github.run_id }}
          OPERATOR_TOKEN: canary-OPERATOR_TOKEN-${{ github.run_id }}
          RESEND_API_KEY: canary-RESEND_API_KEY-${{ github.run_id }}
          APNS_KEY: canary-APNS_KEY-${{ github.run_id }}
          PLATFORM_PRIVATE_KEY: canary-PLATFORM_PRIVATE_KEY-${{ github.run_id }}
          SESSION_SECRET: canary-SESSION_SECRET-${{ github.run_id }}
          ETHERSCAN_API_KEY: canary-ETHERSCAN_API_KEY-${{ github.run_id }}
          BASE_RPC_URL: canary-BASE_RPC_URL-${{ github.run_id }}
          CHAIN_RPC_URL: canary-CHAIN_RPC_URL-${{ github.run_id }}
        run: pnpm --filter @workspace/moolahub-app run build
      - name: Check the built bundle
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/check-no-server-secrets.mjs --require-dist
          if grep -rlE "canary-[A-Z0-9_]+-${RUN_ID}" artifacts/moolahub-app/dist/public; then
            echo "::error::a server secret's value reached the web bundle (files above)"
            exit 1
          fi
